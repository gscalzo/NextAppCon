name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_PACKAGE: uk.co.effectivecode.nextappcon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # No lockfile is committed yet, so install from package.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The package name is set here rather than in app.json so the build
      # doesn't depend on local, uncommitted app.json edits.
      - name: Set Android package
        run: |
          jq --arg pkg "$ANDROID_PACKAGE" '.expo.android.package = $pkg' app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # The template's 2 GB heap / 512 MB metaspace runs out on the release
      # build (KSP and lint hit Metaspace OOM). Runners have 16 GB.
      - name: Raise Gradle memory
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g'
          } >> gradle.properties

      - name: Build release APK
        working-directory: android
        timeout-minutes: 40
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Release builds are signed with the debug keystore by default. When a
      # release keystore is configured in repo secrets, re-sign with it so the
      # signature stays stable across builds and upgrades install in place.
      - name: Sign with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the APK is signed with this run's debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            "$apk"
          "$apksigner" verify --print-certs "$apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Name APK
        id: apk
        run: |
          version=$(jq -r .expo.version app.json)
          name="nextappcon-${version}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # One release per build, marked latest, so
      # releases/latest/download/nextappcon.apk always points at the newest APK.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ steps.apk.outputs.version }}-${{ github.run_number }}"
          cp "${{ steps.apk.outputs.name }}" nextappcon.apk
          gh release create "$tag" nextappcon.apk \
            --target "$GITHUB_SHA" \
            --title "Android APK ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download nextappcon.apk on your phone and open it to install." \
            --latest
